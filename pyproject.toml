[project]
name = "ea-quant"
version = "0.1.0"
description = "Long-running quantitative trading system architecture and implementation."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "typer>=0.12",
  "polars>=1.0",
  "duckdb>=1.0",
  "pandas>=2.2",
  "numpy>=2.0",
  "pyyaml>=6.0",
  "structlog>=24.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2",
  "pytest-cov>=5.0",
  "hypothesis>=6.100",
  "ruff>=0.5",
  "mypy>=1.10",
]

[project.scripts]
ea = "ea.cli.app:app"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_configs = true
files = ["src/ea", "tests"]

