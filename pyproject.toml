[build-system]
requires = ["setuptools==83.0.0", "wheel==0.47.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ea-quant"
version = "0.2.0"
description = "Long-running quantitative trading system architecture and implementation."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "typer>=0.12",
  "numpy>=2.0",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2",
  "pytest-cov>=5.0",
  "hypothesis>=6.100",
  "ruff>=0.5",
  "mypy>=1.10",
  "types-PyYAML>=6.0",
]

[project.scripts]
ea = "ea.cli.app:app"

[tool.uv]
required-version = "==0.11.28"

[tool.ea.coverage]
line-fail-under = 86
branch-fail-under = 71

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"ea.product" = ["phase1_demo_ohlcv_v1.csv"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_configs = true
files = ["src/ea", "tests", "scripts"]
