name: CI

permissions:
  contents: read

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Exact lowercase candidate commit SHA to verify from trusted main.
        required: true
        type: string

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Validate trusted main dispatch
        if: github.event_name == 'workflow_dispatch'
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
        run: |
          set -euo pipefail
          [[ "$CANDIDATE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$GITHUB_REF" == "refs/heads/main" ]]
          [[ "$GITHUB_WORKFLOW_REF" == *".github/workflows/ci.yml@refs/heads/main" ]]
          [[ "$GITHUB_WORKFLOW_SHA" == "$GITHUB_SHA" ]]
          printf 'trusted_workflow_ref=%s\n' "$GITHUB_WORKFLOW_REF"
          printf 'trusted_workflow_sha=%s\n' "$GITHUB_WORKFLOW_SHA"
          printf 'validated_candidate_sha=%s\n' "$CANDIDATE_SHA"
      - uses: actions/checkout@v7
        if: github.event_name != 'workflow_dispatch'
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Assert event exact checkout
        if: github.event_name != 'workflow_dispatch'
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: actions/checkout@v7
        if: github.event_name == 'workflow_dispatch'
        with:
          persist-credentials: false
          ref: ${{ inputs.candidate_sha }}
      - name: Assert dispatched exact checkout
        if: github.event_name == 'workflow_dispatch'
        env:
          EXPECTED_SHA: ${{ inputs.candidate_sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Verify frontend
        working-directory: apps/web
        run: |
          npm ci
          npm run lint
          npm run typecheck
          npm test
          npm run build
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      UV_PROJECT_ENVIRONMENT: venv
    steps:
      - name: Validate trusted main dispatch
        if: github.event_name == 'workflow_dispatch'
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
        run: |
          set -euo pipefail
          [[ "$CANDIDATE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$GITHUB_REF" == "refs/heads/main" ]]
          [[ "$GITHUB_WORKFLOW_REF" == *".github/workflows/ci.yml@refs/heads/main" ]]
          [[ "$GITHUB_WORKFLOW_SHA" == "$GITHUB_SHA" ]]
          printf 'trusted_workflow_ref=%s\n' "$GITHUB_WORKFLOW_REF"
          printf 'trusted_workflow_sha=%s\n' "$GITHUB_WORKFLOW_SHA"
          printf 'validated_candidate_sha=%s\n' "$CANDIDATE_SHA"
      - uses: actions/checkout@v7
        if: github.event_name != 'workflow_dispatch'
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Assert event exact checkout
        if: github.event_name != 'workflow_dispatch'
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: actions/checkout@v7
        if: github.event_name == 'workflow_dispatch'
        with:
          persist-credentials: false
          ref: ${{ inputs.candidate_sha }}
      - name: Assert dispatched exact checkout
        if: github.event_name == 'workflow_dispatch'
        env:
          EXPECTED_SHA: ${{ inputs.candidate_sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version-file: pyproject.toml
      - name: Set up Python
        run: uv python install 3.12
      - name: Reclaim hosted-runner audit headroom
        if: runner.environment == 'github-hosted'
        run: |
          set -euo pipefail
          if [[ "$(uname -s)" != "Linux" ]]; then
            echo "Refusing hosted-runner cleanup on a non-Linux runner."
            exit 1
          fi
          echo "Filesystem state before bounded hosted-runner cleanup:"
          df -B1 /tmp "$GITHUB_WORKSPACE"
          sudo rm -rf -- /usr/local/lib/android/sdk
          sudo rm -rf -- /usr/share/dotnet
          sudo rm -rf -- /usr/local/.ghcup
          echo "Filesystem state after bounded hosted-runner cleanup:"
          df -B1 /tmp "$GITHUB_WORKSPACE"
      - name: Verify hosted-runner audit headroom
        if: runner.environment == 'github-hosted'
        run: |
          set -euo pipefail
          df -B1 /tmp "$GITHUB_WORKSPACE"
          python - <<'PY'
          import os

          required_bytes = 15 * 1024**3
          for path in ("/tmp", os.environ["GITHUB_WORKSPACE"]):
              filesystem = os.statvfs(path)
              available_bytes = filesystem.f_bavail * filesystem.f_frsize
              print(f"{path}: available_bytes={available_bytes}")
              if available_bytes < required_bytes:
                  raise SystemExit(
                      f"{path} has {available_bytes} bytes available; "
                      f"requires at least {required_bytes} bytes"
                  )
          PY
      - name: Verify repository
        run: uv run --no-project --python 3.12 python scripts/verify.py --profile full
