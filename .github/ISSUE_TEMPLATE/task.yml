name: Bounded product task
description: Define one deliverable with a finite review cycle.
title: ""
labels:
  - status:draft
body:
  - type: markdown
    attributes:
      value: >-
        Delivery is the objective. Keep this package bounded and classify risk by actual reachable
        impact. Non-blocking hardening belongs in a linked backlog Issue.
  - type: textarea
    id: objective
    attributes:
      label: Objective
      description: State the one runnable or verifiable outcome that changes.
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope
      description: List allowed files, behavior, and external state.
    validations:
      required: true
  - type: textarea
    id: non_goals
    attributes:
      label: Non-goals
      description: State what is deliberately excluded.
    validations:
      required: true
  - type: textarea
    id: acceptance_criteria
    attributes:
      label: Acceptance Criteria
      description: Provide the finite, testable completion checklist.
    validations:
      required: true
  - type: dropdown
    id: risk_tier
    attributes:
      label: Risk Tier
      description: Choose by actual reachable impact, not keywords or future possibilities.
      options:
        - T0 — documentation/tooling
        - T1 — offline product/simulation
        - T2 — operational authority
        - T3 — real-money/irreversible
    validations:
      required: true
  - type: textarea
    id: risk_rationale
    attributes:
      label: Actual Impact Rationale
      description: Name the reachable execution path and maximum concrete consequence.
    validations:
      required: true
  - type: textarea
    id: validation
    attributes:
      label: Validation
      description: List tests, CI, and the tier-required bounded review.
    validations:
      required: true
  - type: textarea
    id: owner
    attributes:
      label: Owner
      description: Name the Product Owner and Implementer; name the single Reviewer when required.
    validations:
      required: true
